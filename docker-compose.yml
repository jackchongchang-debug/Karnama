services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karnama
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD را در فایل .env تنظیم کنید}
      POSTGRES_DB: karnama
    volumes:
      - db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://karnama:${DB_PASSWORD}@db:5432/karnama
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD را در فایل .env تنظیم کنید}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN را در فایل .env تنظیم کنید}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  caddy:
